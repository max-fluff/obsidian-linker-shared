# Style Settings rows both prose linkers offer, spliced into each plugin's @settings block by
# build.mjs where its %rows:prose% token sits. The prefix is substituted here too.
#
# Colour rows carry no default on purpose: without one, Style Settings shows the variable's
# live computed value, which prose.css declares as the theme's own colour. A themed-color row
# renders a blank swatch until touched, so it is not used here. See CONTRIBUTING.md.

  -
    id: %p%-links
    title: Links
    type: heading
    level: 1
  -
    id: %p%-link-color
    title: Highlight colour
    description: Theme link colour until you pick one.
    type: variable-color
    format: hex
    opacity: false
  -
    id: %p%-link-color-hover
    title: Highlight colour on hover
    description: Theme hover colour until you pick one.
    type: variable-color
    format: hex
    opacity: false
  -
    id: %p%-hue-shift
    title: Hue shift
    description: Shifts the hue of the colours above. 0 is off.
    type: variable-number-slider
    default: 0
    min: -180
    max: 180
    step: 5
  -
    id: %p%-underline-style
    title: Underline style
    type: variable-select
    default: dotted
    options:
      - dotted
      - solid
      - dashed
      - double
      - none
  -
    id: %p%-underline-style-hover
    title: Underline style on hover
    type: variable-select
    default: solid
    options:
      - solid
      - dotted
      - dashed
      - double
      - none
  -
    id: %p%-underline-width
    title: Underline thickness
    type: variable-number-slider
    default: 1
    min: 0
    max: 4
    step: 1
    format: px
  -
    id: %p%-underline-offset
    title: Underline offset
    description: Gap between the text and the underline.
    type: variable-number-slider
    default: 0
    min: 0
    max: 4
    step: 1
    format: px
  -
    id: %p%-link-background
    title: Highlight background
    description: Fill behind the word. With underline style "none" it looks like a marker pen.
    type: variable-color
    format: hex
    opacity: true
  -
    id: %p%-link-background-hover
    title: Highlight background on hover
    description: Same as the background until you pick one.
    type: variable-color
    format: hex
    opacity: true
  -
    id: %p%-link-radius
    title: Background corner radius
    type: variable-number-slider
    default: 0
    min: 0
    max: 6
    step: 1
    format: px
  -
    id: %p%-link-weight
    title: Font weight
    type: variable-select
    default: inherit
    options:
      - inherit
      - '500'
      - '600'
      - '700'
  -
    id: %p%-link-italic
    title: Italic
    type: class-toggle
    default: false
  -
    id: %p%-quiet
    title: Show highlight only on hover
    description: Show the highlight only while the pointer is on the word. The ambiguity symbol stays visible.
    type: class-toggle
    default: false
  -
    id: %p%-ambiguity
    title: Ambiguous terms
    type: heading
    level: 1
  -
    id: %p%-ambiguous-underline-style
    title: Ambiguous-term underline style
    description: Underline for words with more than one target.
    type: variable-select
    default: double
    options:
      - double
      - dotted
      - dashed
      - solid
  -
    id: %p%-ambiguous-underline-width
    title: Ambiguous-term underline thickness
    type: variable-number-slider
    default: 3
    min: 1
    max: 5
    step: 1
    format: px
  -
    id: %p%-ambiguous-color
    title: Ambiguous-term colour
    description: Theme link colour until you pick one. The highlight colour does not apply here.
    type: variable-color
    format: hex
    opacity: false
  -
    id: %p%-ambiguous-hue-shift
    title: Ambiguous-term hue shift
    description: Shifts the hue of the ambiguous-term colour. 0 is off.
    type: variable-number-slider
    default: 0
    min: -180
    max: 180
    step: 5
  -
    id: %p%-ambiguous-symbol
    title: Ambiguous-term symbol
    description: Character or emoji shown next to a word with more than one target. Empty for none.
    type: variable-text
    quotes: true
    default: ''
  -
    id: %p%-mark-after
    title: Put the symbol after the word
    description: Off shows it before the word.
    type: class-toggle
    default: false
  -
    id: %p%-choices-width
    title: Ambiguity list width
    description: Width of the list of meanings shown on hover.
    type: variable-number-slider
    default: 320
    min: 200
    max: 640
    step: 20
    format: px
