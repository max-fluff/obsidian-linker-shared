# Style Settings rows for the side panel. Taken only by the plugins that have one — a row
# here in a plugin with no panel would be a setting that does nothing. See CONTRIBUTING.md.

  -
    id: %p%-side-panel
    title: Side panel
    type: heading
    level: 1
  -
    id: %p%-panel-density
    title: Row density
    description: How tightly the panel's rows are set. Leave empty for the normal spacing.
    type: class-select
    allowEmpty: true
    options:
      -
        label: Dense
        value: %p%-dense
      -
        label: Roomy
        value: %p%-roomy
  -
    id: %p%-panel-font-size
    title: Text size
    description: Base size for the panel's rows. Labels that are deliberately secondary keep their own smaller size.
    type: variable-select
    default: var(--font-ui-small)
    options:
      - var(--font-ui-smaller)
      - var(--font-ui-small)
      - var(--font-ui-medium)
