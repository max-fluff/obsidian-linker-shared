# Style Settings rows for the side panel. Taken only by the plugins that have one — a row
# here in a plugin with no panel would be a setting that does nothing. See CONTRIBUTING.md.

  -
    id: %p%-side-panel
    title: Side panel
    type: heading
    level: 1
  -
    id: %p%-panel-density
    title: Row density
    description: Row spacing in the panel. Empty for normal.
    type: class-select
    allowEmpty: true
    options:
      -
        label: Dense
        value: %p%-dense
      -
        label: Roomy
        value: %p%-roomy
  -
    id: %p%-panel-font-size
    title: Text size
    description: Text size of the panel rows.
    type: variable-select
    default: var(--font-ui-small)
    options:
      - var(--font-ui-smaller)
      - var(--font-ui-small)
      - var(--font-ui-medium)
