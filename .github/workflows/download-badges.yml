name: Download badges

# Obsidian's stats file is ~3 MB and growing; shields.io times out parsing it, so README badges
# read one tiny JSON per plugin from the `badges` branch, kept as a single commit and refreshed daily.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the badges branch from nothing
        run: |
          git fetch --depth=1 origin badges || true
          git checkout --orphan badges
          git rm -rfq .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write one shields endpoint per plugin
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const url = "https://raw.githubusercontent.com/obsidianmd/obsidian-releases/master/community-plugin-stats.json";
            const stats = await (await fetch(url)).json();
            for (const id of ["code-linker", "glossary-linker", "heading-linker", "reference-linker"]) {
              const downloads = stats[id]?.downloads;
              if (!Number.isInteger(downloads)) throw new Error(`no download count for ${id}`);
              const badge = { schemaVersion: 1, label: "downloads", message: String(downloads), color: "7c3aed", namedLogo: "obsidian" };
              writeFileSync(`${id}.json`, JSON.stringify(badge) + "\n");
            }
          '

      - name: Replace the branch if a count changed
        run: |
          git add -A
          if git rev-parse -q --verify origin/badges >/dev/null && git diff --cached --quiet origin/badges; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Download counts"
          git push --force origin badges
